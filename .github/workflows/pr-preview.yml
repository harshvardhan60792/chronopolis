name: PR Preview

# Builds this PR's own repo state into a Chronopolis city and uploads a
# self-contained HTML export as a workflow artifact, so a reviewer can
# download one file and open it in a browser - no server, no CLI - to see
# the 3D shape of the codebase the PR just changed.
#
# This is also the reference implementation for adopting Chronopolis in any
# other repo's CI: copy this file, drop it in .github/workflows/, done.

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install citygen
      # Not on PyPI yet - this step is what actually makes "copy this file"
      # true for any other repo. Omitting it only worked in this repo's own
      # CI because citygen/ happens to sit at the checkout root, resolvable
      # via cwd - it silently breaks the moment this file is copied anywhere
      # else, which is exactly the portability this workflow claims to give.
      run: pip install git+https://github.com/OWNER/chronopolis.git

    - name: Build city.json for this PR's checkout
      # --max-commits bounds this against a repo with an enormous history -
      # CI time should stay predictable regardless of what's being scanned.
      run: python -m citygen build . -o out/pr-preview.city.json --max-commits 500

    - name: Export self-contained HTML
      run: python -m citygen export out/pr-preview.city.json -o out/pr-preview.html

    - name: Upload preview artifact
      uses: actions/upload-artifact@v4
      with:
        name: chronopolis-preview
        path: |
          out/pr-preview.city.json
          out/pr-preview.html
        retention-days: 14

    - name: Compute changed files and PR author emails
      run: |
        git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD > changed.txt
        git log --format=%ae origin/${{ github.base_ref }}...HEAD | sort -u > author_emails.txt
        echo "changed files:"; cat changed.txt

    - name: Build risk comment
      id: risk
      run: |
        python -m citygen pr-report --city out/pr-preview.city.json \
          --changed-from-stdin --pr-author-emails author_emails.txt \
          < changed.txt > comment.md || true
        if [ -s comment.md ]; then echo "has_comment=true" >> "$GITHUB_OUTPUT"
        else echo "has_comment=false" >> "$GITHUB_OUTPUT"; fi

    - name: Comment risk finding on PR
      if: steps.risk.outputs.has_comment == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('comment.md', 'utf8');
          const marker = '<!-- chronopolis-risk -->';
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          try {
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
          } catch (e) {
            // Fork PRs commonly run with a read-only GITHUB_TOKEN with no
            // comment permission - a 403 here must not fail the job.
            console.log('could not post risk comment (likely a fork PR): ' + e.message);
          }

    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const marker = '<!-- chronopolis-pr-preview -->';
          const body = [
            marker,
            '**Chronopolis preview built for this PR.**',
            '',
            `Download \`pr-preview.html\` from the [workflow run artifacts](${runUrl}) and open it directly in a browser - no server needed.`,
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
