name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install pytest

    - name: Run backend tests
      # `python -m pytest citygen/tests/` (not per-file `python file.py`, and
      # NOT `unittest discover`): several test files import pytest for
      # fixtures/parametrize and have no __main__ guard, so running them as
      # raw scripts either crashes on `import pytest` (if pytest isn't
      # installed) or silently executes zero tests (if it is) - confirmed
      # locally by running the old per-file loop, which did both depending
      # on the job. `unittest discover` has its own separate gap: it's blind
      # to bare `test_*` functions (test_phase1.py, test_invariants.py),
      # confirmed locally at 13 tests found instead of the real total, and
      # the skipped files carry the invariant checks (plot overlap,
      # determinism, no-NaN) that matter most. pytest's own discovery
      # correctly finds and runs every style in one pass.
      run: python -m pytest citygen/tests/

    - name: Build toyrepo city
      run: python -m citygen build fixtures/toyrepo -o out/city.json

    - name: Assert invariants
      run: python -m citygen inspect out/city.json

    - name: Set up Node 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Build viewer
      working-directory: ./viewer
      run: |
        npm ci
        npm run build

    - name: Viewer selftest (headless)
      # We would run a headless browser test here against ?selftest=1
      # e.g., using puppeteer or playwright to verify SELFTEST OK is printed.
      run: echo "Selftest pending headless browser setup"

  build-and-test-treesitter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install -e ".[parsers]"
        pip install pytest

    - name: Run backend tests
      run: python -m pytest citygen/tests/

    - name: Build toyrepo city
      run: python -m citygen build fixtures/toyrepo -o out/city.json -v
