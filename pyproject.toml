[project]
name = "citygen"
version = "0.1.0"
description = "Chronopolis repository analyzer - turns a git repo into city.json"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # stdlib only, on purpose (ADR-006)

[project.scripts]
citygen = "citygen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["citygen", "citygen.parsers", "citygen.research"]

[project.optional-dependencies]
parsers = [
    "tree-sitter",
    "tree-sitter-java",
    "tree-sitter-python",
    "tree-sitter-c-sharp",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-go",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-ruby",
    "tree-sitter-php",
    "tree-sitter-kotlin",
    "tree-sitter-swift",
    "tree-sitter-rust"
]
