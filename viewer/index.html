<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronopolis</title>
    <style>
      body { margin: 0; overflow: hidden; background: linear-gradient(180deg, #1a2233 0%, #0b0e14 100%); color: white; font-family: sans-serif; }
      canvas { display: block; }
      #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; }
      /* #ui shrink-wraps its hint/legend-toggle stack, which is exactly what
         that stack wants. But it makes #ui a tiny containing block - any
         viewport-relative `position:absolute` CSS (search box, legend panel,
         tour card, all authored against the real viewport edges) resolved
         against #ui's small auto-sized box instead and rendered squashed
         into its corner. #ui2 is a second, full-viewport layer for exactly
         those widgets. */
      #ui2 { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
      #dropzone { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0e14; z-index: 1000; flex-direction: column; transition: background 0.2s; }
      #dropzone.drag-active { background: #1a2233; outline: 2px dashed #4285F4; outline-offset: -20px; }
      .dz-card { background: rgba(25, 30, 45, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 40px; text-align: center; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
      .dz-title { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
      .dz-subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }
      .dz-box { border: 2px dashed rgba(255,255,255,0.2); border-radius: 6px; padding: 32px; margin-bottom: 32px; cursor: pointer; transition: border-color 0.2s; }
      .dz-box:hover { border-color: rgba(255,255,255,0.4); }
      .dz-cmd { background: #000; padding: 12px; border-radius: 4px; font-family: monospace; font-size: 12px; color: #a8c7fa; margin: 16px 0; display: flex; justify-content: space-between; align-items: center; }
      .dz-cmd span { cursor: pointer; color: #fff; padding: 4px 8px; background: rgba(255,255,255,0.1); border-radius: 4px; }
      .dz-cmd span:hover { background: rgba(255,255,255,0.2); }
      .dz-demos { margin-top: 16px; font-size: 13px; color: #aaa; }
      .dz-demos a { color: #4285F4; text-decoration: none; margin: 0 8px; padding: 4px 8px; border: 1px solid rgba(66, 133, 244, 0.3); border-radius: 4px; }
      .dz-demos a:hover { background: rgba(66, 133, 244, 0.1); }
      .dz-loading { display: none; font-size: 18px; color: #fff; margin-top: 20px; }
      .dz-error { display: none; color: #f28b82; margin-top: 20px; background: rgba(242, 139, 130, 0.1); padding: 12px; border-radius: 4px; border: 1px solid rgba(242, 139, 130, 0.2); }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <div id="ui2"></div>
    <div id="dropzone">
      <div class="dz-card" id="dz-content">
        <div class="dz-title">Chronopolis</div>
        <div class="dz-subtitle">your repository as a living city</div>
        
        <div class="dz-box" onclick="document.getElementById('file-input').click()">
          <div>drop a city.json here</div>
          <div style="color: #666; margin-top: 8px;">or browse</div>
        </div>
        
        <input type="file" id="file-input" style="display: none" accept=".json,.gz">
        
        <div style="text-align: left; font-size: 13px; color: #888;">don't have one?</div>
        <div class="dz-cmd">
          <code>$ python -m citygen build /path/to/repo -o city.json</code>
          <span onclick="navigator.clipboard.writeText('python -m citygen build /path/to/repo -o city.json')">copy</span>
        </div>
        
        <div class="dz-demos">
          or explore a demo:
          <a href="?city=chronopolis.city.json">Chronopolis itself</a>
          <a href="?city=toyrepo.city.json">tiny toy repo</a>
        </div>
      </div>
      
      <div id="dz-loading" class="dz-loading"></div>
      <div id="dz-error" class="dz-error"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
